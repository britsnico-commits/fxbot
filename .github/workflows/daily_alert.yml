name: FXBOT Daily Email Alert
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build email body
        run: |
          pip install pandas || true
          python build_alert.py || echo "build_alert failed"
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: CANIC FXBOT Daily Alert
          to: ${{ secrets.EMAIL_TO }}
          from: CANIC FXBOT
          body: file://email_body.txt
