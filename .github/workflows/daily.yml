name: FXBOT Daily Run - Paper Trading
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt || echo "pip failed"
      - run: python predictor_v3.py || echo "predictor failed - continue"
      - run: python check.py || echo "check failed - continue"
      - run: python paper_trade_v2.py || echo "paper failed - continue"
      - run: python today_signal.py || echo "signal failed - continue"
      - run: python log_live.py || echo "logger failed"
      - run: python live_accuracy.py || echo "accuracy failed"
      - run: |
          git config --global user.email 'bot@fxbot.com'
          git config --global user.name 'FXBOT Daily Bot'
          git add -f results/ today_signal.txt predictions.csv || true
          git commit -m 'Auto-update 15min - paper live' || echo "No changes"
          git pull --rebase || true
          git push || echo "Push skipped"
