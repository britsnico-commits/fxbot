name: FXBOT Live Price Collector

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 min
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install yfinance pandas numpy scikit-learn
      - name: Pull latest
        run: |
          git pull --rebase origin main || git pull origin main
      - name: Collect live price
        run: |
          python log_live.py
      - name: Commit live points
        run: |
          git config user.name "fxbot"
          git config user.email "fxbot@canic.trade"
          git add results/live_prices.csv results/live_accuracy.csv results/signal_history.csv || true
          git diff --staged --quiet || git commit -m "Live price ${{ github.run_number }} - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main
