<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CANIC Deriv Trader - SA IP</title>
<style>
body{font-family:system-ui;padding:16px;background:#0f1115;color:#fff}
button{padding:16px;width:100%;background:#00a651;color:#fff;border:0;border-radius:10px;font-size:18px;font-weight:bold;margin:10px 0}
input{padding:12px;width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #333;background:#1a1d24;color:#fff;margin:8px 0}
#log{background:#1a1d24;padding:12px;border-radius:8px;white-space:pre-wrap;font-family:monospace;font-size:12px;max-height:400px;overflow:auto;margin-top:12px}
.ok{color:#00ff88} .err{color:#ff5555}
</style></head><body>
<h2>CANIC FXBOT - Live Trader (SA IP)</h2>
<div>Signal: <b id="sig">BUY 56.5%</b> - frxEURUSD 1d $10 CALL</div>
<input id="token" placeholder="Paste Deriv API Token here" type="password">
<button onclick="trade()">PLACE LIVE TRADE - FROM THIS PHONE</button>
<button onclick="checkBalance()" style="background:#333;">Check Balance</button>
<div id="log">Ready. Paste token then tap trade.
Your phone IP bypasses Deriv 520 block.</div>
<script>
let ws=null;
function log(m,c=''){ const l=document.getElementById('log'); l.innerHTML+=`\n<span class="${c}">${new Date().toLocaleTimeString()} ${m}</span>`; l.scrollTop=l.scrollHeight; }
function connect(token, onAuth){
  if(ws) ws.close();
  ws=new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");
  ws.onopen=()=>{ log("WS connected (SA IP) - Authorizing..."); ws.send(JSON.stringify({authorize:token})); };
  ws.onmessage=(e)=>{ const d=JSON.parse(e.data); log("<< "+JSON.stringify(d).slice(0,500)); if(d.error){ log("ERROR: "+d.error.message,'err'); ws.close(); return; } if(d.authorize){ log("AUTH OK - Balance: $"+d.authorize.balance,'ok'); if(onAuth) onAuth(d); } else if(d.proposal){ log("Proposal OK id="+d.proposal.id); ws.send(JSON.stringify({buy:d.proposal.id, price:10})); } else if(d.buy){ log("✅✅ LIVE TRADE PLACED: Contract "+d.buy.contract_id+" Price $"+d.buy.buy_price,'ok'); log("Check Deriv app -> Positions",'ok'); } else if(d.balance){ log("Balance: $"+d.balance.balance,'ok'); } };
  ws.onerror=()=>{ log("WS Error - check internet",'err'); };
}
function trade(){
  const token=document.getElementById('token').value.trim();
  if(!token){ alert("Paste token first"); return; }
  const ctype="CALL"; // BUY = CALL
  connect(token, ()=>{
    log("Sending proposal "+ctype+" frxEURUSD 1d $10");
    ws.send(JSON.stringify({proposal:1, amount:10, basis:"stake", contract_type:ctype, currency:"USD", duration:1, duration_unit:"d", symbol:"frxEURUSD"}));
  });
}
function checkBalance(){
  const token=document.getElementById('token').value.trim();
  if(!token){ alert("Paste token"); return; }
  connect(token, null);
}
</script></body></html>
